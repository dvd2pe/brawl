    <script>
    /* ============================================================
       BRAWL HERO STUDIO — BRIDGE
       Applica le patch create nello Studio (localStorage['bhs_patches'])
       e lancia la mappa richiesta (localStorage['bhs_pending_play'])
       sul motore di gioco REALE, senza toccare i file su disco.
       ============================================================ */
    (function () {
        var PATCH_KEY = 'bhs_patches', PLAY_KEY = 'bhs_pending_play';

        function readJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }

        var patches = readJSON(PATCH_KEY) || {};

        // --- 1. JSON atlante sostituito PRIMA del boot (il gioco lo legge durante il preloader)
        if (patches.textureJSON && window.packerplugin) {
            for (var texName in patches.textureJSON) {
                if (window.packerplugin.json.hasOwnProperty(texName)) {
                    window.packerplugin.json[texName] = patches.textureJSON[texName];
                } else {
                    window.packerplugin.textures.push(texName);
                    window.packerplugin.json[texName] = patches.textureJSON[texName];
                }
            }
            console.log('[Studio] atlanti patchati:', Object.keys(patches.textureJSON).join(', '));
        }

        // --- 2. Skin entità: nuovi AnimationSheet sui prototype (le classi esistono già dopo il parse di game.js)
        if (patches.skins && window.ig && ig.AnimationSheet) {
            patches.skins.forEach(function (s) {
                var cls = window[s.cls];
                if (!cls || !cls.prototype) { console.warn('[Studio] classe skin sconosciuta:', s.cls); return; }
                try {
                    var sheet = new ig.AnimationSheet(s.data, s.w, s.h);
                    cls.prototype[s.prop || 'animSheet'] = sheet;
                    console.log('[Studio] skin applicata:', s.cls + '.' + (s.prop || 'animSheet'));
                } catch (e) { console.warn('[Studio] skin fallita:', s.cls, e); }
            });
        }

        // --- 3. Texture sostituite (dataURL) appena l'engine crea gli AtlasImage
        function swapTextures() {
            var names = Object.keys(patches.textures || {});
            if (!names.length || !window.ig || !ig.packer || !ig.packer.textureAtlas || !ig.packer.textureAtlas.length) return false;
            var pending = 0;
            names.forEach(function (name) {
                var idx = window.packerplugin.textures.indexOf(name);
                if (idx < 0 || !ig.packer.textureAtlas[idx]) { pending++; return; }
                if (ig.packer.textureAtlas[idx].__studioPatched) return;
                var img = new Image();
                img.onload = function () {
                    ig.packer.textureAtlas[idx].data = img;
                    ig.packer.textureAtlas[idx].loaded = true;
                    ig.packer.textureAtlas[idx].__studioPatched = true;
                    // invalida i riferimenti cached alle vecchie texture
                    for (var path in ig.Image.cache) {
                        if (Object.prototype.hasOwnProperty.call(ig.Image.cache, path) && ig.packer.isImageInAtlas(path)) {
                            ig.Image.cache[path].atlasImage = null;
                            ig.Image.cache[path].frameData = null;
                        }
                    }
                    console.log('[Studio] texture sostituita:', name);
                };
                img.src = patches.textures[name];
            });
            return pending === 0;
        }

        // --- 4. Comando di play: attende che il gioco sia pronto e salta alla mappa
        function doPlay(cmd) {
            var g = window.ig && ig.game;
            if (!g || !g.director || typeof LevelGame === 'undefined') return false;
            if (!g.playerData && typeof g.resetPlayerData === 'function') g.resetPlayerData();
            if (cmd.type === 'custom') {
                var bucket = _GAMEMAPS.easy;
                for (var i = bucket.length - 1; i >= 0; i--) if (bucket[i].id === cmd.map.id) bucket.splice(i, 1);
                bucket.push(cmd.map);
                g.sessionData.tutorial = false;
                g.forcedLoadMap = true;
                g.fixedMap = cmd.map;
                g.director.jumpTo(LevelGame);
                console.log('[Studio] mappa custom in gioco:', cmd.map.id);
            } else if (cmd.type === 'builtin') {
                g.setMapByName(cmd.id);
                console.log('[Studio] mappa di gioco:', cmd.id);
            }
            localStorage.removeItem(PLAY_KEY);
            return true;
        }

        var started = false;
        var timer = setInterval(function () {
            if (!started) {
                if (swapTextures()) { /* tutte le texture sostituibili sono programmate */ }
                if (window.ig && ig.game && ig.game.playerData) started = true;
            }
            if (started) {
                var cmd = readJSON(PLAY_KEY);
                if (cmd) doPlay(cmd); else clearInterval(timer);
            }
        }, 250);
        console.log('[Studio] bridge attivo');
    })();
    </script>
